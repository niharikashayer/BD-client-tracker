
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BD Prospect Category Matcher</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4f7fb;
      color: #243247;
    }

    .container { max-width: 1000px; margin: auto; }
    h1 { margin-bottom: 8px; }
    h2 { margin-top: 0; }
    .muted { color: #637083; line-height: 1.5; }

    .panel {
      background: white;
      border: 1px solid #dce3ec;
      border-radius: 12px;
      padding: 20px;
      margin: 18px 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 14px 0 7px;
    }

    select, textarea, input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    textarea { min-height: 150px; resize: vertical; }

    button {
      background: #155eef;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 11px 17px;
      font-weight: bold;
      cursor: pointer;
      margin: 12px 8px 0 0;
    }

    button.secondary { background: #475467; }

    .status {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-top: 18px;
    }

    .catalogue {
      background: #fff;
      border: 1px solid #dce3ec;
      border-radius: 10px;
      padding: 16px;
      min-width: 0;
    }

    .category {
      padding: 10px;
      margin: 8px 0;
      border-radius: 7px;
      background: #edf8f1;
      border: 1px solid #c8ead4;
      overflow-wrap: anywhere;
    }

    .reason {
      color: #526273;
      font-size: 13px;
      margin-top: 5px;
    }

    .empty { color: #637083; padding: 10px 0; }
    .count { font-weight: bold; color: #155eef; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .panel { padding: 14px; }
    }
  </style>
</head>

<body>
<div class="container">
  <h1>BD Prospect Category Matcher</h1>
  <p class="muted">
    Select a saved prospect or enter a description manually.
    The matcher will suggest relevant categories from both catalogues.
  </p>

  <section class="panel">
    <label for="prospectSelect">Select a saved prospect</label>
    <select id="prospectSelect">
      <option value="">Loading saved prospects...</option>
    </select>

    <div id="prospectStatus" class="status muted">
      Checking saved prospects...
    </div>

    <label for="prospectName">Prospect / organisation name</label>
    <input id="prospectName" placeholder="Enter a prospect or organisation name">

    <label for="description">Prospect description</label>
    <textarea id="description"
      placeholder="Enter research interests, techniques, products used, laboratory requirements, or paste a prospect description..."></textarea>

    <button id="matchBtn">Find matching categories</button>
    <button id="sampleBtn" class="secondary">Load test example</button>

    <div id="status" class="status" role="status">
      Ready. Select a prospect or enter a description.
    </div>
  </section>

  <section class="panel">
    <h2>Matching results</h2>
    <div id="summary" class="muted">No search performed yet.</div>
    <div id="results" class="results"></div>
  </section>
</div>

function normalize(value) {
  return String(value || '')
    .toLowerCase()
    .replace(/[–—]/g, '-')
    .replace(/\s+/g, ' ')
    .trim();
}

function findMatches(description) {
  const text = normalize(description);
  const found = [];

  if (!text) return found;

  for (const [pattern, category, reason] of rules) {
    if (!pattern.test(text)) continue;

    for (const catalogue of catalogues) {
      const exactCategory = catalogue.categories.find(
        item => item.toLowerCase() === category.toLowerCase()
      );

      if (!exactCategory) continue;

      const exists = found.some(item =>
        item.catalogue === catalogue.catalogue &&
        item.category === exactCategory
      );

      if (!exists) {
        found.push({
          catalogue: catalogue.catalogue,
          category: exactCategory,
          reason: reason
        });
      }
    }
  }

  return found;
}

/* -------- Saved prospect dropdown -------- */

let savedStore = null;
let savedProspects = [];
let selectedProspectId = '';

function getProspectId(prospect, index) {
  return String(
    prospect.id ??
    prospect.prospectId ??
    prospect._id ??
    prospect.email ??
    ('prospect-' + index)
  );
}

function getProspectName(prospect, index) {
  const possibleNames = [
    prospect.organisationName,
    prospect.organizationName,
    prospect.companyName,
    prospect.institutionName,
    prospect.prospectName,
    prospect.institution,
    prospect.organisation,
    prospect.organization,
    prospect.company,
    prospect.name,
    prospect.labName,
    prospect.contactName
  ];

  const name = possibleNames.find(
    value => typeof value === 'string' && value.trim()
  );

  return name ? name.trim() : 'Prospect ' + (index + 1);
}

function getProspectArray(store) {
  if (Array.isArray(store)) return store;

  if (store && typeof store === 'object') {
    const possibleKeys = [
      'prospects',
      'academicLabs',
      'industry',
      'clients',
      'records',
      'data'
    ];

    for (const key of possibleKeys) {
      if (Array.isArray(store[key])) return store[key];
    }
  }

  return [];
}

function loadSavedProspects() {
  const select = document.getElementById('prospectSelect');
  const status = document.getElementById('prospectStatus');

  select.innerHTML = '<option value="">-- Select a prospect --</option>';

  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (!raw) {
      savedStore = null;
      savedProspects = [];
      status.textContent =
        'No saved prospects were found under ' + STORAGE_KEY +
        '. You can still enter a description manually.';
      return;
    }

    savedStore = JSON.parse(raw);
    savedProspects = getProspectArray(savedStore);

    if (!savedProspects.length) {
      status.textContent =
        'The saved data was found, but no prospect list could be identified. You can still enter a description manually.';
      return;
    }

    savedProspects.forEach((prospect, index) => {
      const option = document.createElement('option');
      option.value = getProspectId(prospect, index);
      option.textContent = getProspectName(prospect, index);
      select.appendChild(option);
    });

    status.textContent =
      savedProspects.length + ' saved prospect(s) loaded.';
  } catch (error) {
    console.error('Could not read saved prospects:', error);
    status.textContent =
      'Could not read saved prospect data. You can still enter a description manually.';
  }
}

function getDescriptionFromProspect(prospect) {
  /*
    Prefer fields likely to contain research details.
    The field names are checked flexibly because prospect forms
    can use different names.
  */
  const preferredKeys = [
    'description',
    'researchDescription',
    'researchInterests',
    'researchArea',
    'researchAreas',
    'researchFocus',
    'researchProfile',
    'contactProfile',
    'profile',
    'requirements',
    'productRequirements',
    'interests',
    'notes',
    'productsUsed',
    'techniques',
    'application',
    'applications',
    'summary',
    'about',
    'message'
  ];

  const parts = [];

  for (const key of preferredKeys) {
    const value = prospect[key];

    if (typeof value === 'string' && value.trim()) {
      parts.push(value.trim());
    } else if (Array.isArray(value)) {
      value.forEach(item => {
        if (typeof item === 'string' && item.trim()) {
          parts.push(item.trim());
        }
      });
    }
  }

  const uniqueParts = [...new Set(parts)];

  if (uniqueParts.length) return uniqueParts.join('\n');

  /*
    Fallback: collect other descriptive string fields,
    skipping IDs and basic contact details.
  */
  const excludedKeys = new Set([
    'id', 'prospectId', '_id',
    'name', 'prospectName', 'companyName', 'organisationName',
    'organizationName', 'institutionName', 'institution',
    'email', 'phone', 'mobile', 'website',
    'status', 'createdAt', 'updatedAt'
  ]);

  const fallback = [];

  function collect(value, key, depth) {
    if (depth > 3 || value == null) return;
    if (excludedKeys.has(String(key))) return;

    if (typeof value === 'string') {
      if (value.trim()) fallback.push(value.trim());
      return;
    }

    if (Array.isArray(value)) {
      value.forEach(item => collect(item, '', depth + 1));
      return;
    }

    if (typeof value === 'object') {
      Object.entries(value).forEach(([childKey, childValue]) => {
        collect(childValue, childKey, depth + 1);
      });
    }
  }

  Object.entries(prospect).forEach(([key, value]) => {
    collect(value, key, 0);
  });

  return [...new Set(fallback)].join('\n');
}

function selectProspect() {
  const select = document.getElementById('prospectSelect');
  const selectedId = select.value;

  if (!selectedId) {
    selectedProspectId = '';
    document.getElementById('prospectName').value = '';
    document.getElementById('description').value = '';
    document.getElementById('status').textContent =
      'Enter a description manually or select a saved prospect.';
    return;
  }

  const index = savedProspects.findIndex((prospect, i) =>
    getProspectId(prospect, i) === selectedId
  );

  if (index < 0) {
    document.getElementById('status').textContent =
      'Could not find that prospect in saved data.';
    return;
  }

  const prospect = savedProspects[index];
  selectedProspectId = selectedId;

  document.getElementById('prospectName').value =
    getProspectName(prospect, index);

  document.getElementById('description').value =
    getDescriptionFromProspect(prospect);

  document.getElementById('status').textContent =
    'Prospect loaded. Click Find matching categories.';
}

document.getElementById('prospectSelect').addEventListener(
  'change',
  selectProspect
);

/* -------- Display matching categories -------- */

function renderResults(matches) {
  const results = document.getElementById('results');
  const summary = document.getElementById('summary');

  results.innerHTML = '';

  summary.innerHTML = matches.length
    ? '<span class="count">' + matches.length +
      ' matching category result(s)</span>'
    : 'No keyword rules matched. Try adding research techniques, materials, or product requirements.';

  for (const catalogue of catalogues) {
    const panel = document.createElement('div');
    panel.className = 'catalogue';

    const heading = document.createElement('h3');
    heading.textContent = catalogue.catalogue;
    panel.appendChild(heading);

    const catalogueMatches = matches.filter(
      item => item.catalogue === catalogue.catalogue
    );

    if (!catalogueMatches.length) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = 'No matching categories found.';
      panel.appendChild(empty);
    } else {
      catalogueMatches.forEach(match => {
        const item = document.createElement('div');
        item.className = 'category';

        const name = document.createElement('strong');
        name.textContent = match.category;
        item.appendChild(name);

        const reason = document.createElement('div');
        reason.className = 'reason';
        reason.textContent = 'Matched because: ' + match.reason;
        item.appendChild(reason);

        panel.appendChild(item);
      });
    }

    results.appendChild(panel);
  }
}

/* -------- Save results without deleting existing fields -------- */

function saveMatchesForSelectedProspect(matches) {
  if (!selectedProspectId || !savedStore) return false;

  const index = savedProspects.findIndex((prospect, i) =>
    getProspectId(prospect, i) === selectedProspectId
  );

  if (index < 0) return false;

  const prospect = savedProspects[index];

  /*
    Add or update only the category-match fields.
    Other prospect fields are left untouched.
  */
  prospect.matchedCategoriesCount = matches.length;
  prospect.catalogueCategoryMatches = matches.map(match => ({
    catalogue: match.catalogue,
    category: match.category,
    reason: match.reason
  }));

  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(savedStore));
    return true;
  } catch (error) {
    console.error('Could not save category matches:', error);
    return false;
  }
}

/* -------- Buttons -------- */

document.getElementById('matchBtn').addEventListener('click', function () {
  const description = document.getElementById('description').value;
  const matches = findMatches(description);

  renderResults(matches);

  const saved = saveMatchesForSelectedProspect(matches);

  let message = matches.length
    ? 'Matching complete.'
    : 'No matches found. Try adding more detail.';

  if (selectedProspectId && saved) {
    message += ' Category matches saved to the selected prospect.';
  } else if (selectedProspectId && !saved) {
    message += ' Results are shown, but could not be saved to the prospect.';
  }

  document.getElementById('status').textContent = message;
});

document.getElementById('sampleBtn').addEventListener('click', function () {
  document.getElementById('prospectSelect').value = '';
  selectedProspectId = '';

  document.getElementById('prospectName').value = 'Test Laboratory';
  document.getElementById('description').value =
    'Our lab uses cell culture and cell culture media. We also perform PCR, DNA cloning, RNA purification, and protein analysis. We use microscopy to study synaptic changes in Alzheimer research.';

  document.getElementById('status').textContent =
    'Test example loaded. Click Find matching categories.';
});

document.getElementById('description').addEventListener(
  'keydown',
  function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
      document.getElementById('matchBtn').click();
    }
  }
);

/* Start the page */
loadSavedProspects();
</script>

</html>
